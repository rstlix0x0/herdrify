[package]
name = "probe-deps"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
publish = false

[workspace]

[dependencies]
tokio      = { version = "1.54.1", features = ["rt", "sync", "io-util", "process"] }
serde      = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror  = "2.0.21"
base64     = "0.23.1"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
