[package]
name = "c2-typify-compile-0-8"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[lints]
workspace = true

[workspace]

[workspace.lints.rust]
unsafe_code     = "forbid"
missing_docs    = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic           = { level = "warn", priority = -1 }
nursery            = { level = "warn", priority = -1 }
unwrap_used        = "deny"
expect_used        = "warn"
panic              = "deny"
todo               = "warn"
dbg_macro          = "deny"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
