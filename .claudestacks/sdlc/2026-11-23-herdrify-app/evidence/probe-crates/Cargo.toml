[package]
name = "probe-crates"
version = "0.0.0"
edition = "2024"
publish = false

# Own workspace: this throwaway probe sits inside the herdrify workspace tree.
[workspace]

[dependencies]
tokio = { version = "=1.54.1", features = ["process", "macros", "rt-multi-thread", "time"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
