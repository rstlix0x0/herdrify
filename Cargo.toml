[workspace]
resolver = "3"
members  = ["crates/*"]

[workspace.package]
edition      = "2024"
rust-version = "1.94"
license      = "Apache-2.0"
repository   = "https://github.com/rstlix0x0/herdrify"
authors      = ["rstlix0x0 <rstlix.dev@gmail.com>"]

[workspace.dependencies]
herdrify-core    = { path = "crates/herdrify-core", version = "0.0.0" }
herdrify-hc      = { path = "crates/herdrify-hc", version = "0.1.0" }
herdrify-app     = { path = "crates/herdrify-app", version = "0.1.0" }
herdrify-lua     = { path = "crates/herdrify-lua", version = "0.0.0" }
herdrify-herdr   = { path = "crates/herdrify-herdr", version = "0.0.0" }
herdrify-store   = { path = "crates/herdrify-store", version = "0.0.0" }
herdrify-git     = { path = "crates/herdrify-git", version = "0.0.0" }
herdrify-testkit = { path = "crates/herdrify-testkit", version = "0.0.0" }

tokio      = { version = "1.54.1" }
serde      = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror  = "2.0.21"
base64     = "0.23.1"

[workspace.lints.rust]
unsafe_code     = "forbid"
missing_docs    = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic           = { level = "warn", priority = -1 }
nursery            = { level = "warn", priority = -1 }
unwrap_used        = "deny"
expect_used        = "warn"
panic              = "deny"
todo               = "warn"
dbg_macro          = "deny"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
